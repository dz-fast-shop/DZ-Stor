<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني - طلب سريع</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; color: #1abc9c; font-size: 14px; }
        .product-container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-info h2 { font-size: 20px; margin: 0 0 15px 0; text-align: center; }
        
        /* تصميم معرض الصور الجديد */
        .gallery-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-img-box {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .main-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* للحفاظ على أبعاد الصورة دون تشويهها */
            transition: opacity 0.3s ease;
        }
        .thumb-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .thumb-bar img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .thumb-bar img.active-thumb {
            border-color: #2ecc71; /* إطار أخضر للصورة النشطة */
            transform: scale(1.05);
        }

        .price-box {
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
        }
        .price-box p { margin: 8px 0; display: flex; justify-content: space-between; }
        .price-box hr { border: 0; border-top: 1px solid #cbd5e0; margin: 10px 0; }
        .total-box { font-size: 19px; font-weight: bold; color: #27ae60; }
        .order-section {
            max-width: 500px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 4px solid #2ecc71;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
        }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            flex: 1;
        }
        .radio-label input { width: auto; margin: 0; }
        .submit-btn {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: #27ae60; }
        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>صفحة الشراء السريع</h1>
        <p>يرجى ملء البيانات بدقة لتأكيد طلبيتك</p>
    </header>

    <main class="product-container">
        <div class="product-info">
            <h2>اسم المنتج الخاص بك</h2>
            
            <!-- بداية معرض الصور التفاعلي -->
            <div class="gallery-container">
                <div class="main-img-box">
                    <!-- الصورة الكبيرة الرئيسية -->
                    <img id="main-product-img" src="product1.jpg" alt="صورة المنتج الرئيسية">
                </div>
                <div class="thumb-bar">
                    <!-- الصور المصغرة بالأسفل -->
                    <img class="thumb-img active-thumb" src="product1.jpg" alt="صورة 1" onclick="changeImage(this)">
                    <img class="thumb-img" src="product2.jpg" alt="صورة 2" onclick="changeImage(this)">
                    <img class="thumb-img" src="product3.jpg" alt="صورة 3" onclick="changeImage(this)">
                </div>
            </div>
            <!-- نهاية معرض الصور -->

            <div class="price-box">
                <p>سعر المنتج: <span id="product-price">3500</span> دج</p>
                <p>سعر الشحن: <span id="shipping-price">0</span> دج</p>
                <hr>
                <p class="total-box">الإجمالي الكلي: <span id="total-price">3500</span> دج</p>
            </div>
        </div>
    </main>

    <section class="order-section">
        <form action="https://formsubmit.co/" method="POST">
            <input type="hidden" name="_next" value="https://dz-fast-shop.github.io/DZ-Stor/">
            <input type="hidden" name="_captcha" value="false">
            
            <div class="form-group">
                <label for="name">الاسم واللقب الكامل:</label>
                <input type="text" id="name" name="الاسم الكامل" placeholder="مثال: أحمد بن علي" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="رقم الهاتف" placeholder="06XXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="wilaya">الولاية:</label>
                <select id="wilaya" name="الولاية" required>
                    <option value="" disabled selected>-- اختر الولاية --</option>
                    <option value="1">01 - أدرار</option>
                    <option value="2">02 - الشلف</option>
                    <option value="3">03 - الأغواط</option>
                    <option value="4">04 - أم البواقي</option>
                    <option value="5">05 - باتنة</option>
                    <option value="6">06 - بجاية</option>
                    <option value="7">07 - بسكرة</option>
                    <option value="8">08 - بشار</option>
                    <option value="9">09 - البليدة</option>
                    <option value="10">10 - البويرة</option>
                    <option value="11">11 - تمنراست</option>
                    <option value="12">12 - تبسة</option>
                    <option value="13">13 - تلمسان</option>
                    <option value="14">14 - تيارت</option>
                    <option value="15">15 - تيزي وزو</option>
                    <option value="16">16 - الجزائر العاصمة</option>
                    <option value="17">17 - الجلفة</option>
                    <option value="18">18 - جيجل</option>
                    <option value="19">19 - سطيف</option>
                    <option value="20">20 - سعيدة</option>
                    <option value="21">21 - سكيكدة</option>
                    <option value="22">22 - سيدي بلعباس</option>
                    <option value="23">23 - عنابة</option>
                    <option value="24">24 - قالمة</option>
                    <option value="25">25 - قسنطينة</option>
                    <option value="26">26 - المدية</option>
                    <option value="27">27 - مستغانم</option>
                    <option value="28">28 - المسيلة</option>
                    <option value="29">29 - معسكر</option>
                    <option value="30">30 - ورقلة</option>
                    <option value="31">31 - وهران</option>
                    <option value="32">32 - البيض</option>
                    <option value="33">33 - إليزي</option>
                    <option value="34">34 - برج بوعريريج</option>
                    <option value="35">35 - بومرداس</option>
                    <option value="36">36 - الطارف</option>
                    <option value="37">37 - تندوف</option>
                    <option value="38">38 - تسمسيلت</option>
                    <option value="39">39 - الوادي</option>
                    <option value="40">40 - خنشلة</option>
                    <option value="41">41 - سوق أهراس</option>
                    <option value="42">42 - تيبازة</option>
                    <option value="43">43 - ميلة</option>
                    <option value="44">44 - عين الدفلى</option>
                    <option value="45">45 - النعامة</option>
                    <option value="46">46 - عين تموشنت</option>
                    <option value="47">47 - غرداية</option>
                    <option value="48">48 - غليزان</option>
                    <option value="49">49 - تيميمون</option>
                    <option value="50">50 - برج باجي مختار</option>
                    <option value="51">51 - أولاد جلال</option>
                    <option value="52">52 - بني عباس</option>
                    <option value="53">53 - عين صالح</option>
                    <option value="54">54 - عين قزام</option>
                    <option value="55">55 - تقرت</option>
                    <option value="56">56 - الجانت</option>
                    <option value="57">57 - المغير</option>
                    <option value="58">58 - المنيعة</option>
                </select>
            </div>

            <div class="form-group">
                <label for="commune">البلدية أو عنوان السكن الدقيق:</label>
                <input type="text" id="commune" name="البلدية والعنوان" placeholder="مثال: بلدية الدار البيضاء، حي 5 جويلية" required>
            </div>

            <div class="form-group">
                <label>مكان الاستلام (نوع التوصيل):</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="نوع التوصيل" value="home" checked>
                        توصيل للمنزل
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="نوع التوصيل" value="desk">
                        استلام من المكتب
                    </label>
                </div>
            </div>

            <input type="hidden" id="hidden-shipping" name="تكلفة الشحن">
            <input type="hidden" id="hidden-total" name="المبلغ الإجمالي">

            <button type="submit" class="submit-btn">تأكيد الطلب الآن</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لمتجرنا.</p>
    </footer>

    <script>
        // دالة تبديل الصور التفاعلية عند الضغط عليها
        function changeImage(element) {
            const mainImg = document.getElementById('main-product-img');
            mainImg.style.opacity = '0.3'; // تأثير انتقال ناعم عند التغيير
            
            setTimeout(() => {
                mainImg.src = element.src;
                mainImg.style.opacity = '1';
            }, 150);

            // إزالة اللون الأخضر من الصورة القديمة وإضافته للجديدة
            document.querySelectorAll('.thumb-img').forEach(thumb => {
                thumb.classList.remove('active-thumb');
            });
            element.classList.add('active-thumb');
        }

        // قاعدة بيانات الـ 58 ولاية كاملة مع أسعار الشحن
        const algeriaData = {
            "1": { name: "أدرار", shippingHome: 1000 },
            "2": { name: "الشلف", shippingHome: 600 },
            "3": { name: "الأغواط", shippingHome: 700 },
            "4": { name: "أم البواقي", shippingHome: 600 },
            "5": { name: "باتنة", shippingHome: 600 },
            "6": { name: "بجاية", shippingHome: 550 },
            "7": { name: "بسكرة", shippingHome: 650 },
            "8": { name: "بشار", shippingHome: 900 },
            "9": { name: "البليدة", shippingHome: 450 },
            "10": { name: "البويرة", shippingHome: 500 },
            "11": { name: "تمنراست", shippingHome: 1200 },
            "12": { name: "تبسة", shippingHome: 600 },
            "13": { name: "تلمسان", shippingHome: 650 },
            "14": { name: "تيارت", shippingHome: 600 },
            "15": { name: "تيزي وزو", shippingHome: 500 },
            "16": { name: "الجزائر العاصمة", shippingHome: 350 },
            "17": { name: "الجلفة", shippingHome: 650 },
            "18": { name: "جيجل", shippingHome: 550 },
            "19": { name: "سطيف", shippingHome: 550 },
            "20": { name: "سعيدة", shippingHome: 650 },
            "21": { name: "سكيكدة", shippingHome: 550 },
            "22": { name: "سيدي بلعباس", shippingHome: 650 },
            "23": { name: "عنابة", shippingHome: 550 },
            "24": { name: "قالمة", shippingHome: 550 },
            "25": { name: "قسنطينة", shippingHome: 550 },
            "26": { name: "المدية", shippingHome: 500 },
            "27": { name: "مستغانم", shippingHome: 600 },
            "28": { name: "المسيلة", shippingHome: 600 },
            "29": { name: "معسكر", shippingHome: 600 },
            "30": { name: "ورقلة", shippingHome: 800 },
            "31": { name: "وهران", shippingHome: 600 },
            "32": { name: "البيض", shippingHome: 750 },
            "33": { name: "إليزي", shippingHome: 1200 },
            "34": { name: "برج بوعريريج", shippingHome: 550 },
            "35": { name: "بومرداس", shippingHome: 450 },
            "36": { name: "الطارف", shippingHome: 600 },
            "37": { name: "تندوف", shippingHome: 1200 },
            "38": { name: "تسمسيلت", shippingHome: 600 },
            "39": { name: "الوادي", shippingHome: 700 },
            "40": { name: "خنشلة", shippingHome: 600 },
            "41": { name: "سوق أهراس", shippingHome: 600 },
            "42": { name: "تيبازة", shippingHome: 500 },
            "43": { name: "ميلة", shippingHome: 550 },
            "44": { name: "عين الدفلى", shippingHome: 550 },
            "45": { name: "النعامة", shippingHome: 750 },
            "46": { name: "عين تموشنت", shippingHome: 650 },
            "47": { name: "غرداية", shippingHome: 750 },
            "48": { name: "غليزان", shippingHome: 600 },
            "49": { name: "تيميمون", shippingHome: 1000 },
            "50": { name: "برج باجي مختار", shippingHome: 1400 },
            "51": { name: "أولاد جلال", shippingHome: 700 },
            "52": { name: "بني عباس", shippingHome: 1000 },
            "53": { name: "عين صالح", shippingHome: 1100 },
            "54": { name: "عين قزام", shippingHome: 1400 },
            "55": { name: "تقرت", shippingHome: 800 },
            "56": { name: "الجانت", shippingHome: 1400 },
            "57": { name: "المغير", shippingHome: 750 },
            "58": { name: "المنيعة", shippingHome: 850 }
        };

        const productPrice = 3500; 

        const wilayaSelect = document.getElementById("wilaya");
        const shippingText = document.getElementById("shipping-price");
        const totalText = document.getElementById("total-price");
        const hiddenShipping = document.getElementById("hidden-shipping");
        const hiddenTotal = document.getElementById("hidden-total");

        function updatePrices() {
            const selectedWilaya = wilayaSelect.value;
            if (!selectedWilaya) return;

            let shippingCost = algeriaData[selectedWilaya].shippingHome;
            const deliveryType = document.querySelector('input[name="نوع التوصيل"]:checked').value;
            
            if (deliveryType === "desk") {
                shippingCost = Math.max(150, shippingCost - 250); 
            }

            const totalCost = productPrice + shippingCost;

            shippingText.innerText = shippingCost;
            totalText.innerText = totalCost;

            hiddenShipping.value = shippingCost + " دج";
            hiddenTotal.value = totalCost + " دج";
        }

        wilayaSelect.addEventListener("change", updatePrices);

        document.querySelectorAll('input[name="نوع التوصيل"]').forEach(radio => {
            radio.addEventListener("change", updatePrices);
        });
    </script>
</body>
</html>
