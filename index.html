<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني - طلب سريع</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 20px 10px;
            position: relative;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; color: #1abc9c; font-size: 14px; }
        
        /* زر مخفي جداً في الزاوية للأدمن فقط */
        .admin-secret-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: transparent;
            border: none;
            color: #1a252f; /* نفس لون الهيدر عشان ما يبانش */
            cursor: pointer;
            font-size: 10px;
        }

        .product-container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-info h2 { font-size: 20px; margin: 0 0 15px 0; text-align: center; }
        
        .gallery-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-img-box {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .main-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }
        .thumb-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .thumb-bar img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .thumb-bar img.active-thumb {
            border-color: #2ecc71;
            transform: scale(1.05);
        }

        .price-box {
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
        }
        .price-box p { margin: 8px 0; display: flex; justify-content: space-between; }
        .price-box hr { border: 0; border-top: 1px solid #cbd5e0; margin: 10px 0; }
        .total-box { font-size: 19px; font-weight: bold; color: #27ae60; }
        
        .order-section {
            max-width: 500px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 4px solid #2ecc71;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
        }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            flex: 1;
        }
        .radio-label input { width: auto; margin: 0; }
        .submit-btn {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: #27ae60; }
        
        /* لوحة التحكم مخفية افتراضياً بـ display: none */
        .admin-panel {
            display: none; 
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12 rgba(0,0,0,0.15);
            border-top: 4px solid #e74c3c;
        }
        .admin-panel h3 { margin-top: 0; color: #c0392b; text-align: center; }
        .update-btn {
            width: 100%;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .update-btn:hover { background-color: #c0392b; }

        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>صفحة الشراء السريع</h1>
        <p>يرجى ملء البيانات بدقة لتأكيد طلبيتك</p>
        <!-- زر سري غير مرئي للزبون متواجد في أقصى يسار الهيدر فوق -->
        <button class="admin-secret-btn" onclick="openAdminPanel()">.</button>
    </header>

    <main class="product-container">
        <div class="product-info">
            <h2 id="product-title">اسم المنتج الافتراضي</h2>
            
            <div class="gallery-container">
                <div class="main-img-box">
                    <img id="main-product-img" src="product1.jpg" alt="صورة المنتج">
                </div>
                <div class="thumb-bar" id="thumb-bar-container">
                    <img class="thumb-img active-thumb" src="product1.jpg" onclick="changeImage(this)">
                    <img class="thumb-img" src="product2.jpg" onclick="changeImage(this)">
                    <img class="thumb-img" src="product3.jpg" onclick="changeImage(this)">
                </div>
            </div>

            <div class="price-box">
                <p>سعر المنتج: <span id="product-price">3500</span> دج</p>
                <p>سعر الشحن: <span id="shipping-price">0</span> دج</p>
                <hr>
                <p class="total-box">الإجمالي الكلي: <span id="total-price">3500</span> دج</p>
            </div>
        </div>
    </main>

    <section class="order-section">
        <form action="https://formsubmit.co/imedsadaoui0@gmail.com" method="POST">
            <input type="hidden" name="_next" value="https://dz-fast-shop.github.io/DZ-Stor/thanks.html">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" id="hidden-product-name" name="اسم المنتج" value="اسم المنتج الافتراضي">

            <div class="form-group">
                <label for="name">الاسم واللقب الكامل:</label>
                <input type="text" id="name" name="الاسم الكامل" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="رقم الهاتف" required>
            </div>

            <div class="form-group">
                <label for="wilaya">الولاية:</label>
                <select id="wilaya" name="الولاية" required>
                    <option value="" disabled selected>-- اختر الولاية --</option>
                    <option value="1">01 - أدرار</option>
                    <option value="16">16 - الجزائر العاصمة</option>
                    <option value="19">19 - سطيف</option>
                    <!-- باقي الولايات مدمجة تلقائياً في السكربت الأصلي -->
                </select>
            </div>

            <div class="form-group">
                <label for="commune">البلدية أو العنوان الدقيق:</label>
                <input type="text" id="commune" name="البلدية والعنوان" required>
            </div>

            <div class="form-group">
                <label>مكان الاستلام:</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="نوع التوصيل" value="home" checked> توصيل للمنزل</label>
                    <label class="radio-label"><input type="radio" name="نوع التوصيل" value="desk"> استلام من المكتب</label>
                </div>
            </div>

            <input type="hidden" id="hidden-shipping" name="تكلفة الشحن">
            <input type="hidden" id="hidden-total" name="المبلغ الإجمالي">

            <button type="submit" class="submit-btn">تأكيد الطلب الآن</button>
        </form>
    </section>

    <!-- لوحة التحكم (مخفية ومحمية) -->
    <section class="admin-panel" id="adminPanelSection">
        <h3>🛠️ لوحة تحكم الأدمن</h3>
        <div class="form-group">
            <label>اسم المنتج الجديد:</label>
            <input type="text" id="input-new-title">
        </div>
        <div class="form-group">
            <label>السعر الجديد (دج):</label>
            <input type="number" id="input-new-price">
        </div>
        <div class="form-group">
            <label>رابط الصورة 1:</label>
            <input type="text" id="input-img1">
        </div>
        <div class="form-group">
            <label>رابط الصورة 2:</label>
            <input type="text" id="input-img2">
        </div>
        <div class="form-group">
            <label>رابط الصورة 3:</label>
            <input type="text" id="input-img3">
        </div>
        <button type="button" class="update-btn" onclick="applyStoreUpdates()">حفظ وتطبيق التعديلات ✨</button>
    </section>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لمتجرنا.</p>
    </footer>

    <script>
        // دالة إظهار لوحة التحكم بكلمة سر
        function openAdminPanel() {
            let password = prompt("أدخل كلمة مرور الأدمن لرؤية لوحة التحكم:");
            if (password === "1234") { // يمكنك تغيير '1234' لأي كلمة سر تختارها
                document.getElementById("adminPanelSection").style.display = "block";
                window.scrollTo(0, document.body.scrollHeight); // النزول لأسفل الصفحة تلقائياً
            } else {
                alert("كلمة المرور خاطئة!");
            }
        }

        // عند تحميل الصفحة: جلب البيانات المخزنة سابقاً إن وجدت
        window.onload = function() {
            if(localStorage.getItem("p_title")) {
                productPrice = parseInt(localStorage.getItem("p_price"));
                document.getElementById("product-title").innerText = localStorage.getItem("p_title");
                document.getElementById("hidden-product-name").value = localStorage.getItem("p_title");
                document.getElementById("product-price").innerText = productPrice;
                
                // استعادة الصور
                let savedImgs = JSON.parse(localStorage.getItem("p_imgs"));
                if(savedImgs && savedImgs.length > 0) {
                    document.getElementById("main-product-img").src = savedImgs[0];
                    const thumbBar = document.getElementById("thumb-bar-container");
                    thumbBar.innerHTML = "";
                    savedImgs.forEach((url, index) => {
                        const imgThumb = document.createElement("img");
                        imgThumb.src = url;
                        imgThumb.className = "thumb-img" + (index === 0 ? " active-thumb" : "");
                        imgThumb.onclick = function() { changeImage(this); };
                        thumbBar.appendChild(imgThumb);
                    });
                }
            }
        }

        function changeImage(element) {
            const mainImg = document.getElementById('main-product-img');
            mainImg.style.opacity = '0.3';
            setTimeout(() => {
                mainImg.src = element.src;
                mainImg.style.opacity = '1';
            }, 150);
            document.querySelectorAll('.thumb-img').forEach(thumb => thumb.classList.remove('active-thumb'));
            element.classList.add('active-thumb');
        }

        const algeriaData = {
            "1": { name: "أدرار", shippingHome: 1000 },
            "16": { name: "الجزائر العاصمة", shippingHome: 350 },
            "19": { name: "سطيف", shippingHome: 550 }
            // (باقي الولايات تعمل بنفس الطريقة)
        };

        let productPrice = 3500; 

        const wilayaSelect = document.getElementById("wilaya");
        const priceText = document.getElementById("product-price");
        const shippingText = document.getElementById("shipping-price");
        const totalText = document.getElementById("total-price");
        const hiddenShipping = document.getElementById("hidden-shipping");
        const hiddenTotal = document.getElementById("hidden-total");

        function updatePrices() {
            const selectedWilaya = wilayaSelect.value;
            if (!selectedWilaya) return;
            let shippingCost = algeriaData[selectedWilaya] ? algeriaData[selectedWilaya].shippingHome : 500;
            const deliveryType = document.querySelector('input[name="نوع التوصيل"]:checked').value;
            if (deliveryType === "desk") shippingCost = Math.max(150, shippingCost - 250); 
            const totalCost = productPrice + shippingCost;
            shippingText.innerText = shippingCost;
            totalText.innerText = totalCost;
            hiddenShipping.value = shippingCost + " دج";
            hiddenTotal.value = totalCost + " دج";
        }

        wilayaSelect.addEventListener("change", updatePrices);
        document.querySelectorAll('input[name="نوع التوصيل"]').forEach(radio => radio.addEventListener("change", updatePrices));

        // تطبيق وحفظ التعديلات في متصفحك بشكل دائم (LocalStorage)
        function applyStoreUpdates() {
            const newTitle = document.getElementById("input-new-title").value;
            const newPrice = document.getElementById("input-new-price").value;
            const img1 = document.getElementById("input-img1").value;
            const img2 = document.getElementById("input-img2").value;
            const img3 = document.getElementById("input-img3").value;

            if (newTitle.trim() !== "") {
                document.getElementById("product-title").innerText = newTitle;
                document.getElementById("hidden-product-name").value = newTitle;
                localStorage.setItem("p_title", newTitle);
            }
            if (newPrice.trim() !== "" && !isNaN(newPrice)) {
                productPrice = parseInt(newPrice);
                priceText.innerText = productPrice;
                localStorage.setItem("p_price", productPrice);
                updatePrices();
            }

            let images = [img1, img2, img3].filter(url => url.trim() !== "");
            if (images.length > 0) {
                document.getElementById("main-product-img").src = images[0];
                const thumbBar = document.getElementById("thumb-bar-container");
                thumbBar.innerHTML = "";
                images.forEach((url, index) => {
                    const imgThumb = document.createElement("img");
                    imgThumb.src = url;
                    imgThumb.className = "thumb-img" + (index === 0 ? " active-thumb" : "");
                    imgThumb.onclick = function() { changeImage(this); };
                    thumbBar.appendChild(imgThumb);
                });
                localStorage.setItem("p_imgs", JSON.stringify(images));
            }
            alert("🎯 تم حفظ وتعديل متجرك بنجاح!");
            document.getElementById("adminPanelSection").style.display = "none"; // إخفاء اللوحة بعد الحفظ
        }
    </script>
</body>
</html>
